name: Deploy to Vercel

# Estate pattern (html-sites): a push to main is what deploys. site/ is
# committed, so every merge that changes the shipped pages deploys them.
# Requires three repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# The token travels by env var, never argv; the CLI version is pinned.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build.py"
      - "vercel.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy site/ to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::${var} secret is not set on this repo. Add it to enable deploys."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          npx --yes vercel@65.12.1 deploy --prod --yes
