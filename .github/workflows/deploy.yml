name: Deploy to Vercel

# Estate pattern (html-sites): a push to main is what deploys. site/ is
# committed, so every merge that changes the shipped pages deploys them.
# Requires the repo secret VERCEL_TOKEN (a Vercel token on mp's account).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build.py"
      - "vercel.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy site/ to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set on this repo. Add it (Vercel account token) to enable deploys."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
